name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    name: DBテスト（pgTAP・同時実行）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Supabase(DB) 起動 + マイグレーション + seed
        run: supabase db start
      - name: pgTAP テスト
        run: supabase test db
      - name: 同時利用テスト
        run: npm run test:concurrency

  functions:
    name: Edge Functions テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --config supabase/functions/deno.json --allow-env supabase/functions
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

  web:
    name: 画面ビルド・テスト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-dummy
